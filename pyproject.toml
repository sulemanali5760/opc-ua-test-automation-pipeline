[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opcua-test-pipeline"
version = "0.2.0"
description = "Check live PLC data (OPC UA or Beckhoff ADS) against a written test case and get a PASS/FAIL report."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Suleman Ali" }]
keywords = ["opc-ua", "plc", "test-automation", "commissioning", "beckhoff-ads", "industrial-automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
dependencies = ["asyncua>=1.1,<3", "pyyaml>=6.0"]

[project.optional-dependencies]
ads = ["pyads>=3.4"]
dev = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/sulemanali5760/opc-ua-test-automation-pipeline"

[project.scripts]
opcua-test = "opcua_test_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
