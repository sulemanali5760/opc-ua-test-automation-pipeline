name: release
# Push a tag vX.Y.Z -> a GitHub release with
#   - the wheel and source archive (pip-installable straight from the release page)
#   - offline bundles: this tool plus every package it needs, one zip per system and Python version,
#     for machines without internet. Each bundle is installed in a clean environment here before it ships.
# PyPI upload runs only when the repository variable PYPI_PUBLISH is "true" (after trusted publishing is set up).
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
env:
  DIST: opcua-test-pipeline
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag must match the version in pyproject.toml
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, pyproject $version"; exit 1; }
      - run: python -m pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
  bundle:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Collect the tool and everything it needs as wheels
        run: |
          python -m pip wheel .  -w bundle
          cat > bundle/INSTALL.txt <<EOF
          $DIST $GITHUB_REF_NAME, offline bundle for ${{ runner.os }}, Python ${{ matrix.python }}

          Install without internet, from inside this folder:

              python -m pip install --no-index --find-links . $DIST

          Everything needed is in this folder. Nothing is downloaded.
          EOF
      - name: Install from the bundle alone, in a clean environment, and run it
        run: |
          python -m venv clean
          PY=$([ -x clean/bin/python ] && echo clean/bin/python || echo clean/Scripts/python)
          $PY -m pip install --no-index --find-links bundle $DIST
          BIN=$(dirname $PY)
          PATH="$BIN:$PATH" opcua-test --help
      - name: Zip
        run: |
          os=$(echo "${{ runner.os }}" | tr '[:upper:]' '[:lower:]')
          python -c "import shutil,sys; shutil.make_archive(sys.argv[1], 'zip', 'bundle')" "$DIST-${GITHUB_REF_NAME#v}-offline-$os-py${{ matrix.python }}"
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.os }}-${{ matrix.python }}
          path: "*.zip"
  release:
    needs: [build, bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd out && sha256sum * > SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" out/* --title "$DIST ${GITHUB_REF_NAME#v}" \
            --notes "See CHANGELOG.md. Install: pip install the .whl, or unzip an offline bundle on a machine without internet and follow INSTALL.txt. SHA-256 of every file: SHA256SUMS.txt."
  pypi:
    needs: build
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
